name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        # Use npm ci for reproducible installs from package-lock.json.
        run: npm ci

  test:
    runs-on: ubuntu-latest
    needs: install

    steps:
      # Each job gets a fresh runner, so the repository must be checked out again.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        # Install dependencies in this fresh runner before running Jest.
        run: npm ci

      - name: Run tests
        run: npm test